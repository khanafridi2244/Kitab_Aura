<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KitabAura - a multilingual digital library for Pashto, Urdu and English books." />
    <meta name="theme-color" content="#0b2e23" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f4c3a'/%3E%3Cpath d='M9 8h4v16H9zM13 16l8-8h5l-8 8 8 8h-5z' fill='%23d9a441'/%3E%3C/svg%3E"
    />
    <title>KitabAura - Where Every Book Has a Story</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Runs before the page paints, so the saved theme shows with no flash
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
